
image boot.vfat {
  vfat {
    files = {
      "bcm2708-rpi-zero-w.dtb",
      "rpi-firmware/bootcode.bin",
      "rpi-firmware/cmdline.txt",
      "rpi-firmware/config.txt",
      "rpi-firmware/fixup.dat",
      "rpi-firmware/start.elf",
      "rpi-firmware/overlays",
      "video.txt",
      "zImage"
    }
  }
  size = 2G
}


image lss-video.vfat {
  vfat {
    label = "LSS_VIDEO"
    extraargs = "-F 32"
    files = {
      "Readme.txt"
    }
  }
  size = 1G
}


image sdcard.img {
  hdimage {
  }

  partition boot {
    partition-type = 0xC
    bootable = "true"
    image = "boot.vfat"
  }

  partition rootfs {
    partition-type = 0x83
    image = "rootfs.ext4"
  }

  partition video {
    partition-type = 0xC
    image = "lss-video.vfat"
  }
}
