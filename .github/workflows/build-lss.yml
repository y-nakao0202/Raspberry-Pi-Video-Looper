name: Build LSS Pi Zero image (experimental)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Checkout LSS fork
        uses: actions/checkout@v4
      - name: Free space for Buildroot
        uses: jlumbroso/free-disk-space@main
        with:
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          tool-cache: false
          swap-storage: false
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential git subversion bc zip unzip cpio rsync wget curl \
            libncurses-dev zlib1g-dev gawk flex bison gettext libssl-dev \
            gcc-multilib g++-multilib pkg-config file patch python3 \
            autoconf automake libtool
      - name: Checkout Buildroot 2021.11 and board config
        run: |
          git clone --depth 1 --branch 2021.11 https://github.com/buildroot/buildroot.git buildroot
          cp -a board/tt_rpi buildroot/board/tt_rpi
          cp configs/rpi0w_tt_defconfig buildroot/configs/rpi0w_tt_defconfig
      - name: Build firmware and psplash
        run: |
          make -C buildroot rpi0w_tt_defconfig
          make -C buildroot -j2
      - name: Compress bootable image
        run: |
          xz -T 2 -2 -k buildroot/output/images/sdcard.img
      - name: Upload image
        uses: actions/upload-artifact@v4
        with:
          name: lss-pi-zero-image
          path: buildroot/output/images/sdcard.img.xz
          retention-days: 7
